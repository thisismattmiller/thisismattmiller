<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="m.begin+12.5s" dur="0.5s" fill="freeze"/><set attributeName="opacity" to="0" begin="m.begin"/><rect x="40" y="430" width="360" height="126" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="1.6" /><text x="52" y="455" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">No rule check fires</text><text x="52" y="473" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">Every element is authorized, the prefix</text><text x="52" y="491" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">is established and --Finance is on the</text><text x="52" y="509" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">list. Whether Social change is one of</text><text x="52" y="527" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">the categories the clause names is not</text><text x="52" y="545" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">a mechanical question.</text></g>
